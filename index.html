
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharath Garments | Premium Quality</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- MOCK DATA ---
        const PRODUCTS = [
            { id: 1, name: "Royal Blue Linen Shirt", price: 29.99, category: "Men", image: "https://images.unsplash.com/photo-1596755094514-f87e3f7da08d?w=500&q=80" },
            { id: 2, name: "Classic White Cotton Tee", price: 19.99, category: "Men", image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500&q=80" },
            { id: 3, name: "Summer Floral Dress", price: 34.50, category: "Women", image: "https://images.unsplash.com/photo-1572804013309-59a88b719185?w=500&q=80" },
            { id: 4, name: "Elegant Evening Gown", price: 89.99, category: "Women", image: "https://images.unsplash.com/photo-1595777457583-95e059d58198?w=500&q=80" },
            { id: 5, name: "Formal Suit Jacket", price: 120.00, category: "Men", image: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=500&q=80" },
            { id: 6, name: "Silk Scarf", price: 15.00, category: "Accessories", image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500&q=80" },
        ];

        // --- COMPONENTS ---

        // 1. Navbar Component
        const Navbar = ({ cartCount, onToggleCart }) => {
            return (
                <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
                    <div className="container mx-auto px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 text-white p-2 rounded-lg">
                                <i data-lucide="shirt" className="w-6 h-6"></i>
                            </div>
                            <span className="text-2xl font-bold text-gray-800 tracking-tight">Bharath<span className="text-blue-600">Garments</span></span>
                        </div>
                        
                        <div className="hidden md:flex gap-8 text-sm font-medium text-gray-600">
                            <a href="#" className="hover:text-blue-600 transition">Home</a>
                            <a href="#" className="hover:text-blue-600 transition">Men</a>
                            <a href="#" className="hover:text-blue-600 transition">Women</a>
                            <a href="#" className="hover:text-blue-600 transition">Collections</a>
                        </div>

                        <button 
                            onClick={onToggleCart} 
                            className="relative p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition"
                        >
                            <i data-lucide="shopping-bag" className="w-6 h-6 text-gray-700"></i>
                            {cartCount > 0 && (
                                <span className="absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">
                                    {cartCount}
                                </span>
                            )}
                        </button>
                    </div>
                </nav>
            );
        };

        // 2. Hero Section
        const Hero = () => {
            return (
                <div className="relative bg-gray-900 text-white py-24">
                    <div className="absolute inset-0 opacity-40 bg-[url('https://images.unsplash.com/photo-1441986300917-6467466f92ed?w=1600&q=80')] bg-cover bg-center"></div>
                    <div className="container mx-auto px-6 relative z-10 text-center">
                        <h1 className="text-5xl md:text-6xl font-bold mb-6 animate-fade-in">Timeless Elegance</h1>
                        <p className="text-xl text-gray-200 mb-8 max-w-2xl mx-auto">Discover the finest collection from Bharath Garments. Quality fabrics, modern cuts, and styles that speak your language.</p>
                        <a href="#shop" className="inline-block bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-medium transition transform hover:scale-105 shadow-lg">
                            Shop Now
                        </a>
                    </div>
                </div>
            );
        };

        // 3. Product Card
        const ProductCard = ({ product, onAddToCart }) => {
            return (
                <div className="group bg-white rounded-xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 flex flex-col h-full">
                    <div className="relative h-64 overflow-hidden bg-gray-100">
                        <img 
                            src={product.image} 
                            alt={product.name} 
                            className="w-full h-full object-cover transform group-hover:scale-110 transition duration-500"
                        />
                        <div className="absolute top-2 right-2 bg-white/80 backdrop-blur-sm p-2 rounded-full opacity-0 group-hover:opacity-100 transition">
                            <i data-lucide="heart" className="w-4 h-4 text-red-500"></i>
                        </div>
                    </div>
                    <div className="p-6 flex flex-col flex-grow">
                        <span className="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">{product.category}</span>
                        <h3 className="text-lg font-bold text-gray-800 mb-2 line-clamp-2">{product.name}</h3>
                        <div className="mt-auto flex justify-between items-center">
                            <span className="text-xl font-bold text-gray-900">${product.price.toFixed(2)}</span>
                            <button 
                                onClick={() => onAddToCart(product)}
                                className="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-600 transition flex items-center gap-2"
                            >
                                <i data-lucide="plus-circle" className="w-4 h-4"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Cart Sidebar
        const CartSidebar = ({ isOpen, onClose, cartItems, onRemove }) => {
            useEffect(() => {
                if(isOpen) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => { document.body.style.overflow = 'unset'; };
            }, [isOpen]);

            const total = cartItems.reduce((sum, item) => sum + item.price, 0);

            return (
                <>
                    {/* Backdrop */}
                    <div 
                        className={`fixed inset-0 bg-black/40 backdrop-blur-sm z-50 transition-opacity duration-300 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                        onClick={onClose}
                    ></div>
                    
                    {/* Sidebar */}
                    <div className={`fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-50 shadow-2xl transform transition-transform duration-300 flex flex-col ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <h2 className="text-xl font-bold">Your Cart</h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6">
                            {cartItems.length === 0 ? (
                                <div className="text-center py-10 text-gray-500">
                                    <i data-lucide="shopping-cart" className="w-16 h-16 mx-auto mb-4 opacity-20"></i>
                                    <p>Your cart is empty.</p>
                                    <button onClick={onClose} className="text-blue-600 mt-2 hover:underline">Start Shopping</button>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    {cartItems.map((item, index) => (
                                        <div key={index} className="flex gap-4">
                                            <img src={item.image} alt={item.name} className="w-20 h-20 object-cover rounded-lg bg-gray-100" />
                                            <div className="flex-1">
                                                <div className="flex justify-between">
                                                    <h4 className="font-medium text-gray-800">{item.name}</h4>
                                                    <button onClick={() => onRemove(index)} className="text-red-500 hover:text-red-700"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                </div>
                                                <p className="text-sm text-gray-500">${item.price.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {cartItems.length > 0 && (
                            <div className="p-6 border-t border-gray-100 bg-gray-50">
                                <div className="flex justify-between text-lg font-bold mb-4">
                                    <span>Total</span>
                                    <span>${total.toFixed(2)}</span>
                                </div>
                                <button className="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition shadow-lg">
                                    Checkout
                                </button>
                            </div>
                        )}
                    </div>
                </>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [cartItems, setCartItems] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('All');

            // Initialize Lucide Icons
            useEffect(() => {
                lucide.createIcons();
            }, [cartItems, isCartOpen]); // Re-render icons when cart state changes

            const addToCart = (product) => {
                setCartItems([...cartItems, product]);
                setIsCartOpen(true);
            };

            const removeFromCart = (index) => {
                const newCart = [...cartItems];
                newCart.splice(index, 1);
                setCartItems(newCart);
            };

            const filteredProducts = activeTab === 'All' 
                ? PRODUCTS 
                : PRODUCTS.filter(p => p.category === activeTab);

            return (
                <div className="min-h-screen">
                    <Navbar cartCount={cartItems.length} onToggleCart={() => setIsCartOpen(true)} />
                    
                    <Hero />

                    {/* Categories Filter */}
                    <div className="container mx-auto px-6 py-12">
                        <div className="flex justify-center gap-4 mb-12">
                            {['All', 'Men', 'Women', 'Accessories'].map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setActiveTab(cat)}
                                    className={`px-6 py-2 rounded-full text-sm font-medium transition ${
                                        activeTab === cat 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'bg-white text-gray-600 hover:bg-gray-100'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* Products Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProducts.map(product => (
                                <ProductCard 
                                    key={product.id} 
                                    product={product} 
                                    onAddToCart={addToCart} 
                                />
                            ))}
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-300 py-12">
                        <div className="container mx-auto px-6 grid md:grid-cols-4 gap-8">
                            <div>
                                <h3 className="text-white text-xl font-bold mb-4">Bharath Garments</h3>
                                <p className="text-sm leading-relaxed">Bringing quality and comfort to your wardrobe since 2010. Premium fabrics for everyday wear.</p>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Quick Links</h4>
                                <ul className="space-y-2 text-sm">
                                    <li><a href="#" className="hover:text-white">About Us</a></li>
                                    <li><a href="#" className="hover:text-white">Our Story</a></li>
                                    <li><a href="#" className="hover:text-white">Contact</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Customer Care</h4>
                                <ul className="space-y-2 text-sm">
                                    <li><a href="#" className="hover:text-white">Shipping Policy</a></li>
                                    <li><a href="#" className="hover:text-white">Returns & Exchanges</a></li>
                                    <li><a href="#" className="hover:text-white">Size Guide</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Contact</h4>
                                <p className="text-sm mb-2">123 Fashion Street, Mumbai</p>
                                <p className="text-sm mb-4">info@bharathgarments.com</p>
                                <div className="flex gap-4">
                                    <i data-lucide="instagram" className="w-5 h-5 hover:text-white cursor-pointer"></i>
                                    <i data-lucide="facebook" className="w-5 h-5 hover:text-white cursor-pointer"></i>
                                    <i data-lucide="twitter" className="w-5 h-5 hover:text-white cursor-pointer"></i>
                                </div>
                            </div>
                        </div>
                        <div className="container mx-auto px-6 mt-12 pt-8 border-t border-gray-800 text-center text-xs text-gray-500">
                            &copy; 2023 Bharath Garments. All rights reserved.
                        </div>
                    </footer>

                    <CartSidebar 
                        isOpen={isCartOpen} 
                        onClose={() => setIsCartOpen(false)} 
                        cartItems={cartItems} 
                        onRemove={removeFromCart} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
