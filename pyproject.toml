[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nava-agent"
version = "0.2.6"
description = "NAVA: Autonomous Personal Agent OS with Governed Execution & Rich Cowork Studio"
readme = "README.md"
authors = [{ name = "NAVA Team" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-groq>=0.1.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "mcp>=1.0.0",
    "markdown>=3.5.0",
    "xhtml2pdf>=0.2.11",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",
    "typst>=0.11.0",
    "httpx>=0.27.0",
    "duckduckgo-search>=6.0.0",
    "playwright>=1.40.0"
]

[project.scripts]
nava = "nava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nava" = ["prompts/*.txt"]

